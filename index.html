<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Dev Tools</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body id="site">
    <header id="site-head">
      <a href="#" class="logo">
        <i class="bi bi-code-square logo-icon"></i>
        Cursor
      </a>
      <nav aria-label="navigation-links" class="nav">
        <a class="nav-links" href="#">Models</a>
        <a class="nav-links" href="#">Product</a>
        <a class="nav-links" href="#">Enterprise</a>
        <a class="nav-links" href="#">Pricing</a>
        <a class="nav-links" href="#">Resources</a>
      </nav>
      <div class="btns">
        <button class="signin-btn">Sign In</button>
        <button class="download-btn">Download</button>
        <button class="menu-btn">
          <i class="bi bi-list btn-icon"></i>
        </button>
      </div>
    </header>
    <main id="site-main">
      <section class="hero">
        <h1>Cursor is your coding agent for building ambitious software.</h1>
        <div class="btns">
          <button class="started-btn">
            Get Started <i class="bi bi-arrow-right"></i>
          </button>
          <button class="download-btn">
            Download for macOS <i class="bi bi-download"></i>
          </button>
          <button class="demo-btn">
            Request a demo <i class="bi bi-arrow-right"></i>
          </button>
        </div>
        <figure></figure>
      </section>
      <section class="logo-cloud">
        <h2>Trusted every day by teams that build world-class software</h2>
        <div class="logo-grid">
          <div class="logo-card">
            <img src="./assets/cloud-logos/strip.svg" alt="Stripe Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/datadog.svg" alt="DataDog Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/linear.svg" alt="Linear Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/nvidia.svg" alt="Nvidia Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/figma.svg" alt="Figma Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/ramp.svg" alt="Ramp Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/decagon.svg" alt="Decagon Image" />
          </div>
          <div class="logo-card">
            <img src="./assets/cloud-logos/adobe.svg" alt="Adobe Image" />
          </div>
        </div>
      </section>
      <section class="temp"></section>
    </main>
  </body>
</html>
